<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Şu an dinliyorum</title>
    <style>
        :root { color-scheme: light dark; --bg: #fafafa; --text: #18181b; --sub: #71717a; --code: #f0f0f2; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0c; --text: #f4f4f5; --sub: #a1a1aa; --code: #1c1c1f; } }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
               font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; box-sizing: border-box; }
        main { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 20px; }
        h1 { font-size: 15px; margin: 0; color: var(--sub); font-weight: 600; }
        pre { margin: 0; padding: 12px 14px; background: var(--code); border-radius: 10px; font-size: 12px; overflow-x: auto; color: var(--sub); }
    </style>
</head>
<body>
    <main>
        <h1>Şu an dinliyorum</h1>
        <div data-ytm-now-playing></div>
        <pre>GET /api/now-playing
GET /api/now-playing/stream   (SSE)
GET /api/stats?range=7d|30d|365d|all
GET /api/card.svg?theme=dark|light</pre>
    </main>
    <script src="/widget.js" defer></script>
</body>
</html>
